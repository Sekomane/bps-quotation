<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPS Marketing | Quotation Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">

        <!-- LEFT SIDE: FORM CONTROLS -->
        <aside class="controls-side">

            <h2>Quotation Generator</h2>

            <section class="form-section">
                <h3>Business Info</h3>

                <div class="grid-2">
                    <div>
                        <label>Business Name</label>
                        <input type="text" id="businessName" value="BPS Marketing Pty Ltd">
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="businessEmail" value="info@bpsmarketing.co.za">
                    </div>

                    <div>
                        <label>Phone</label>
                        <input type="text" id="businessPhone" value="079 046 3747">
                    </div>

                    <div>
                        <label>Quote #</label>
                        <input type="text" id="quoteNumber" value="QT-001">
                    </div>

                    <div class="grid-full">
                        <label>Business Address</label>
                        <input type="text" id="businessAddress" value="38-17th Avenue, Alexandra, 2090 Johannesburg">
                    </div>

                    <div>
                        <label>Quote Date</label>
                        <input type="date" id="quoteDate">
                    </div>

                    <div>
                        <label>Valid Until</label>
                        <input type="date" id="validUntil">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Client Details</h3>

                <div class="grid-2">
                    <div>
                        <label>Client Name</label>
                        <input type="text" id="clientName" placeholder="Client name">
                    </div>

                    <div>
                        <label>Client Email</label>
                        <input type="email" id="clientEmail" placeholder="client@example.com">
                    </div>

                    <div>
                        <label>Client Phone</label>
                        <input type="text" id="clientPhone" placeholder="+27 12 345 6789">
                    </div>

                    <div class="grid-full">
                        <label>Client Address</label>
                        <input type="text" id="clientAddress" placeholder="Street, City, Code">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h3>Item Ordered</h3>

                <div class="grid-2">
                    <div class="grid-full">
                        <label>Description</label>
                        <input type="text" id="itemDescription" placeholder="e.g. Website Design">
                    </div>

                    <div>
                        <label>Qty</label>
                        <input type="number" id="itemQty" min="1" value="1">
                    </div>

                    <div>
                        <label>Price (R)</label>
                        <input type="number" id="itemPrice" min="0" step="0.01" value="0">
                    </div>
                </div>

                <button type="button" class="btn-primary" onclick="addItem()">Add Item</button>

                <div class="items-table-wrapper">
                    <table id="itemsInputTable">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="form-section">
                <h3>Total Amount</h3>

                <div class="grid-2">
                    <div>
                        <label>Discount (%)</label>
                        <input type="number" id="discount" min="0" max="100" value="0">
                    </div>

                    <div>
                        <label>VAT / Tax (%)</label>
                        <input type="number" id="tax" min="0" max="100" value="0">
                    </div>
                </div>
            </section>

               <section class="form-section">
                <h3>Terms & Conditions</h3>

                <textarea id="termsConditions" rows="5">1. A 50% deposit is required before work begins.
2. The balance is payable before final handover.
3. Client content must be supplied on time to avoid delays.
4. Extra work outside this quotation may be charged separately.</textarea>
            </section>

            <div class="action-buttons">
                <button type="button" class="btn-secondary" onclick="renderQuote()">Refresh Preview</button>
                <button type="button" class="btn-outline" onclick="downloadPDF()">Download PDF</button>
                <button type="button" class="btn-danger" onclick="clearAllFields()">Clear All</button>
            </div>

        </aside>

        <!-- RIGHT SIDE: QUOTE PREVIEW -->
        <main class="preview-side">
            <section id="quotePreview" class="quote-preview">

                <div id="HeaderComponent"></div>
                <div id="ClientDetailsComponent"></div>
                <div id="ItemOrderedComponent"></div>
                <div id="TotalAmountComponent"></div>
                <div id="PaymentDetailsComponent"></div>
                <div id="TermsAndConditionsComponent"></div>
                <div id="FooterComponent"></div>
            </section>
        </main>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="../js/components.js"></script>
<script src="../js/calculations.js"></script>
<script src="../js/items.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/app.js"></script>

</body>
</html>
